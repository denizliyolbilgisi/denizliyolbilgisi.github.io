<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DYB – Denizli Yol Bilgisi</title>
  <meta name="description" content="Denizli radar, trafik ve ilan paylaşımı">
  <meta name="theme-color" content="#0B2240">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DYB">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Tema: sayfa açılırken yanıp sönmesin diye en başta uygulanır
    try {
      var t = localStorage.getItem("dyb_theme") || "system";
      var d = t === "dark" || (t === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", d ? "dark" : "light");
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <div class="boot">
      <div class="badge">DYB</div>
      <p>Yükleniyor…</p>
    </div>
  </div>
  <script src="vendor/supabase.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
  <noscript>DYB için JavaScript açık olmalıdır.</noscript>
</body>
</html>
